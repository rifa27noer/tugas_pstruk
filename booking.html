<section class="section">

    <h1>FORM PEMESANAN TIKET</h1>

    <p>Silakan lengkapi data pemesanan kamu.</p>

    <form id="bookingForm">

        <label>Nama Lengkap</label>

        <input
            type="text"
            id="nama"
            placeholder="Masukkan nama lengkap"
            required
        >

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Masukkan email"
            required
        >

        <label>Nomor Telepon</label>

        <input
            type="tel"
            id="telepon"
            placeholder="Masukkan nomor telepon"
            required
        >

        <label>Kategori Tiket</label>

        <input
            type="text"
            id="kategori"
            readonly
        >

        <label>Harga Tiket</label>

        <input
            type="text"
            id="harga"
            readonly
        >

        <label>Jumlah Tiket</label>

        <input
            type="number"
            id="jumlah"
            min="1"
            max="5"
            value="1"
            required
        >

        <h3 id="total">Total: Rp150.000</h3>

        <button type="submit" class="btn">
            Lanjutkan Pemesanan
        </button>

    </form>

</section>
